@if (bubblesIllustrationStartEnd() || illustrationStartEndUrl()) {
	<div class="mainLayout-bubblesStartEnd">
		@if (bubblesIllustrationStartEnd()) {
			<div
				[innerHtml]="`${domain}${path}bubbles/startEnd-${bubblesIllustrationStartEnd()}${extension}` | luSafeExternalSvg"
				aria-hidden="true"
			></div>
		}
		@if (illustrationStartEndUrl()) {
			<img class="mainLayout-bubblesStartEnd-illustration" [attr.src]="illustrationStartEndUrl()" alt="" />
		}
	</div>
}

@if (bubblesIllustrationEndStart() || illustrationEndStartUrl()) {
	<div class="mainLayout-bubblesEndStart">
		@if (bubblesIllustrationEndStart()) {
			<div
				[innerHtml]="`${domain}${path}bubbles/endStart-${bubblesIllustrationEndStart()}${extension}` | luSafeExternalSvg"
				aria-hidden="true"
			></div>
		}
		@if (illustrationEndStartUrl()) {
			<img class="mainLayout-bubblesEndStart-illustration" [attr.src]="illustrationEndStartUrl()" alt="" />
		}
	</div>
}

<div class="mainLayout-sidebar">
	<ng-content select="[mainLayoutSidebar]" />
</div>
<div class="mainLayout-content">
	<div class="mainLayout-content-inside">
		<div class="mainLayout-content-inside-header" [class.mod-sticky]="headerSticky()">
			<ng-content select="[mainLayoutHeader]" />
		</div>
		<ng-content />
		<div class="mainLayout-content-inside-footer" [class.mod-sticky]="footerSticky()">
			<ng-content select="[mainLayoutFooter]" />
		</div>
	</div>
</div>
