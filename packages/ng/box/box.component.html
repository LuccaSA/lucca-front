@if (killable()) {
	<div class="box-close">
		<button luButton="ghost" type="button" (click)="killed.emit()">
			<lu-icon icon="signClose" [alt]="intl().close" />
		</button>
	</div>
}
@if (heading(); as heading) {
	<div class="box-header">
		@if (bubbleIcon(); as bubbleIcon) {
			<lu-bubble-icon [icon]="bubbleIcon" />
		} @else {
			<ng-content select="[boxHeaderStartSlot]" />
		}
		<div class="box-header-text">
			<div class="box-header-text-heading" role="heading" [attr.aria-level]="hx()">
				<ng-container *luPortal="heading" />
			</div>
			@if (subheading(); as subheading) {
				<p class="box-header-text-subheading"><ng-container *luPortal="subheading" /></p>
			}
		</div>
	</div>
}
<div class="box-slot"><ng-content /></div>
@if (isFancy() && (bubble() || illustration())) {
	<div class="box-illustrations">
		<lu-ornament [bubble]="bubble()" [illustration]="illustration()" />
	</div>
}
