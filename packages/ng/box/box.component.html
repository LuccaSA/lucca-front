@if (killable()) {
	<div class="box-close">
		<button luButton="ghost" type="button" (click)="killed.emit()">
			<lu-icon icon="signClose" [alt]="intl().close" />
		</button>
	</div>
}
@if (heading(); as heading) {
	@if (bubbleIcon(); as bubbleIcon) {
		<lu-bubble-icon class="box-icon" [icon]="bubbleIcon" />
	}
	<div class="box-header">
		<div role="heading" class="box-header-title" [attr.aria-level]="hx()"><ng-container *luPortal="heading" /></div>
		@if (subtitle(); as subtitle) {
			<p class="box-header-description"><ng-container *luPortal="subtitle" /></p>
		}
	</div>
}
<div class="box-slot"><ng-content /></div>
@if (bubbleSrc() || illustrationSrc()) {
	<div class="box-illustrations">
		@if (bubbleSrc(); as bubbleSrc) {
			<div class="box-illustrations-back" aria-hidden="true" [innerHtml]="bubbleSrc | luSafeExternalSvg"></div>
		}
		@if (illustrationSrc(); as illustrationSrc) {
			<img alt="" class="box-illustrations-front" [attr.src]="illustrationSrc" />
		}
	</div>
}
