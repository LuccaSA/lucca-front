<div [class]="pickerClasses()" (copy)="copyHandler($event)" (paste)="pasteHandler($event)" (animationend)="keyPressed.set(false)">
	<fieldset class="timePicker-fieldset" [disabled]="disabled()">
		<legend>
			<span class="pr-u-mask">{{ label() }}</span>
		</legend>
		@if (isDaysUnit()) {
			<lu-duration-days-part
				#daysPart
				class="timePicker-fieldset-group"
				[disabled]="disabled()"
				[label]="intl().durationPickerDays"
				[value]="days()"
				[(isValueSet)]="isValueSet"
				[decimals]="daysDecimals()"
				[maxDigits]="maxDigits()"
				[hideValue]="shouldHideValue()"
				[displayArrows]="displayArrows()"
				(valueChange)="daysInputHandler($event)"
				(inputControlClick)="daysControlHandler($event)"
				(nonDigitKeyPressed)="keyPressed.set(true)"
				(touched)="onTouched()"
			/>
			<div
				aria-hidden="true"
				[class]="unitSuffixClasses()"
				[attr.data-content-before]="intl().durationPickerDaysUnit"
				(click)="focusDays()"
			></div>
		} @else {
			<lu-time-picker-part
				#hoursPart
				class="timePicker-fieldset-group"
				[disabled]="disabled()"
				[label]="intl().timePickerHours"
				[value]="hours()"
				[(isValueSet)]="isValueSet"
				[decimalConf]="hoursDecimalConf"
				[hideValue]="shouldHideValue()"
				[displayArrows]="displayArrows()"
				[maxDigits]="maxDigits()"
				(valueChange)="hoursInputHandler($event)"
				(nextRequest)="focusPart('minutes')"
				(inputControlClick)="inputControlClickHandler('hours', $event)"
				(nonDigitKeyPressed)="keyPressed.set(true)"
			/>
			<div aria-hidden="true" [class]="fieldsetSuffixClasses()" [attr.data-content-before]="separator()" (click)="focusPart('hours')"></div>
			<lu-time-picker-part
				#minutesPart
				class="timePicker-fieldset-group"
				[label]="intl().timePickerMinutes"
				[value]="minutes()"
				[(isValueSet)]="isValueSet"
				[max]="59"
				[hideValue]="shouldHideValue()"
				[displayArrows]="displayArrows()"
				[disabled]="disabled() || !minutesIncrement()"
				showZero
				(valueChange)="minutesInputHandler($event)"
				(prevRequest)="focusPart('hours')"
				(inputControlClick)="inputControlClickHandler('minutes', $event)"
				(nonDigitKeyPressed)="keyPressed.set(true)"
			/>
		}
	</fieldset>
</div>
