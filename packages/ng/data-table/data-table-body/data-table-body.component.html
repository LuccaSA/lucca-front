@if (group() || groupSlot()) {
	@if (groupButtonAlt(); as groupButtonAlt) {
		<tr class="dataTable-body-row mod-group">
			<td class="dataTable-body-row-cell" [attr.colspan]="colspan()">
				<div class="dataTable-body-row-cell-expand">
					<button
						type="button"
						class="dataTable-body-row-cell-expand-button"
						luButton
						disclosure
						[attr.aria-expanded]="expanded()"
						(click)="expandedToggle()"
					>
						<lu-icon icon="arrowChevronTop" [alt]="groupButtonAlt" />
					</button>
					@if (group(); as group) {
						<ng-container *luPortal="group" />
					} @else {
						<ng-content select="[luDataTableBodyGroup]" />
					}
				</div>
			</td>
		</tr>
	}
}
<ng-content />
