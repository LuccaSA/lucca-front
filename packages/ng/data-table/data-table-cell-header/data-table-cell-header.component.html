@if (sort()) {
	<button luButton type="button" class="tableSortable" [class.mod-ellipsis]="sortWithEllipsis()" (click)="toggleSort()" #sortButton>
		<span
			class="tableSortable-label"
			[luTooltipDisabled]="!sortWithEllipsis()"
			luTooltip
			luTooltipWhenEllipsis
			[luTooltipTriggerAnchor]="sortButtonRef()"
			><ng-container *ngTemplateOutlet="contentTpl"
		/></span>
		<span class="tableSortable-arrows">
			<lu-icon icon="chevronTop" class="tableSortable-arrows-ascending" />
			<lu-icon icon="chevronBottom" class="tableSortable-arrows-descending" />
		</span>
	</button>
} @else {
	<ng-container *ngTemplateOutlet="contentTpl" />
}

<ng-template #contentTpl><ng-content /></ng-template>
