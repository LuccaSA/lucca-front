@if (groupHost) {
	<ng-container *ngTemplateOutlet="pairTpl" />
} @else {
	<dl class="presentation" [class.mod-S]="resolvedSize() === 'S'">
		<ng-container *ngTemplateOutlet="pairTpl" />
	</dl>
}

<ng-template #pairTpl>
	<dt class="presentation-term">
		<ng-container *luPortal="label()" />
	</dt>
	<dd class="presentation-definition">
		@if (noValue()) {
			<div aria-hidden="true" data-content-before="–"></div>
		}
		<ng-content />
	</dd>
</ng-template>
