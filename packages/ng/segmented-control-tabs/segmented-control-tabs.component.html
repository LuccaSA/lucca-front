@if (!externalTablist()) {
	<ng-container *ngTemplateOutlet="tablistTemplate()" />
}
<ng-content />

<ng-template #tablist>
	<ul class="segmentedControl" role="tablist" [attr.aria-label]="ariaLabel()" [class.mod-S]="small()" [class.mod-vertical]="vertical()">
		@for (panel of tabs(); track panel.id) {
			<li class="segmentedControl-item" role="presentation">
				<button
					#tabButton
					class="segmentedControl-item-action"
					type="button"
					role="tab"
					[attr.id]="panel.labelId"
					[attr.aria-controls]="panel.panelId"
					[attr.aria-selected]="active() === panel.value()"
					[attr.tabindex]="active() !== panel.value() ? '-1' : null"
					(click)="active.set(panel.value())"
					(keydown.arrowleft)="$event.preventDefault(); previous()"
					(keydown.arrowup)="$event.preventDefault(); previous()"
					(keydown.arrowright)="$event.preventDefault(); next()"
					(keydown.arrowdown)="$event.preventDefault(); next()"
					(keydown.home)="$event.preventDefault(); first()"
					(keydown.end)="$event.preventDefault(); last()"
				>
					@if (panel.icon(); as icon) {
						<lu-icon [icon]="icon" />
					}
					@if (panel.hiddenLabelText(); as hiddenLabelText) {
						<span class="pr-u-mask">{{ hiddenLabelText }}</span>
						<span
							class="segmentedControl-item-action-tooltip"
							[luTooltip]="hiddenLabelText"
							luTooltipOnlyForDisplay
							[luTooltipAnchor]="tabButton"
							[luTooltipTriggerAnchor]="tabButton"
						></span>
					} @else if (panel.label(); as label) {
						<ng-container *luPortal="label" />
					}
				</button>
			</li>
		}
	</ul>
</ng-template>
