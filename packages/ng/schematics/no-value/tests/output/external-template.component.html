<table class="indexTable">
	<tbody class="indexTable-body">
		@for (row of rows; track row.name) {
			<tr class="indexTable-body-row">
				<th class="indexTable-body-row-cell">{{ row.name }}</th>
				<td class="indexTable-body-row-cell">
					@if (row.team) {
						{{ row.team }}
					} @else {
						<lu-no-value />
					}
				</td>
			</tr>
		}
	</tbody>
</table>
<ng-template #row>
	<td class="dataTable-body-row-cell"><lu-no-value /></td>
</ng-template>
