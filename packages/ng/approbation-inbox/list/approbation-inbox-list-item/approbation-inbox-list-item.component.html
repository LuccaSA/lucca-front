@if (selectable()) {
	<lu-form-field
		[label]="intl().selectItem | intlParams: { title: title() }"
		hiddenLabel
		class="approbationInbox-list-content-items-item-formfieldOptional"
	>
		<lu-checkbox-input [(ngModel)]="checked" [ngModelOptions]="{ standalone: true }" />
	</lu-form-field>
}
<div class="approbationInbox-list-content-items-item-content">
	<div class="approbationInbox-list-content-items-item-content-info" [class.mod-center]="center()">
		<div class="approbationInbox-list-content-items-item-content-info-visual">
			<ng-content select="[approbationInboxListItemVisual]" />
		</div>
		<div class="approbationInbox-list-content-items-item-content-info-main">
			<div class="approbationInbox-list-content-items-item-content-info-main-title" #titleSlot>
				<ng-content select="[approbationInboxListItemTitle]" />
			</div>
			<ng-content />
		</div>
		<div class="approbationInbox-list-content-items-item-content-info-rightContent">
			<ng-content select="[approbationInboxListItemRightContent]" />
		</div>
	</div>
</div>
