<lu-listbox-option
	[checked]="selectableItem.isSelected()"
	[mixed]="selectableItem.isMixed()"
	[hovered]="selectableItem.isHighlighted()"
	[disabled]="selectableItem.disabled"
	(click)="selectOption($event)"
	[elementId]="selectableItem.idAttribute()"
	[treeitemLevel]="treeitemContent() ? level : null"
	[collapsable]="collapsable()"
	[(expanded)]="expanded"
	[attr.aria-level]="treeitemPosition() === null ? null : level"
	[attr.aria-posinset]="treeitemPosition()"
	[attr.aria-setsize]="treeitemPosition() === null ? null : treeitemSetSize()"
>
	<ng-container [ngTemplateOutlet]="optionContent" />
	<!-- Re-projected into the option's own wrapper, so the tree rows are stacked by the listbox
	itself: the level has to be passed along because a content query stops at this ng-content -->
	<ng-content select="[treeitem]" ngProjectAs="[treeitem]" />
</lu-listbox-option>

<ng-template #optionContent>
	<div class="listboxOption-content-value">
		<ng-container *luOptionOutlet="optionTpl(); value: selectableItem.option()" />

		@if (groupTemplateLocation() === "option") {
			@if (grouping(); as grouping) {
				<div class="listboxOption-content-group">
					<ng-container *luPortal="grouping.content; context: { $implicit: selectableItem.option() | luOptionGroup: grouping.selector }" />
				</div>
			}
		}
	</div>

	@if (hasChildren() && !selectableItem.disabled) {
		<!-- `optionItem-icons` is kept until v23 for consumers that hook on it: prefer `.listboxOption-content-treeActions` -->
		<div class="listboxOption-content-treeActions optionItem-icons">
			<span
				class="listboxOption-content-treeActions-action mod-parent parentOnly"
				(click)="$event.stopPropagation(); onlyParent.emit()"
				[luTooltip]="intl().onlyParent"
				luTooltipOnlyForDisplay
			>
				<lu-icon icon="listTree" class="listboxOption-content-treeActions-action-icon" />
				<span class="pr-u-mask">{{ intl().onlyParent }}</span>
			</span>
			<span
				class="listboxOption-content-treeActions-action mod-children childrenOnly"
				(click)="$event.stopPropagation(); onlyChildren.emit()"
				[luTooltip]="intl().onlyChildren"
				luTooltipOnlyForDisplay
			>
				<lu-icon icon="listTree" class="listboxOption-content-treeActions-action-icon" />
				<span class="pr-u-mask">{{ intl().onlyChildren }}</span>
			</span>
		</div>
	}
</ng-template>
