<div
	cdkTrapFocus="true"
	cdkTrapFocusAutoCapture="true"
	role="dialog"
	aria-modal="true"
	[attr.aria-labelledby]="'luModalTitle' + modalId"
	[class]="modalClasses.panelInner"
>
	<div [class]="modalClasses.panelContainer" role="document">
		<div class="lu-modal-header" tabindex="-1" cdkFocusInitial>
			<button type="button" luButton="ghost" size="S" class="lu-modal-header-close" (click)="dismiss()" [luTooltip]="closeLabel">
				<lu-icon icon="signClose" [alt]="closeLabel" />
			</button>
			<h1 [attr.id]="'luModalTitle' + modalId" class="lu-modal-header-title">{{ title$ | async }}</h1>
		</div>
		<div class="lu-modal-content">
			<ng-container #container />
		</div>
		<div class="lu-modal-footer">
			@if (!isSubmitHidden) {
				<button
					type="button"
					luButton
					class="palette-{{ submitPalette }}"
					[ngClass]="submitClass$ | async"
					[disabled]="(submitDisabled$ | async) ?? false"
					(click)="submit()"
				>
					{{ submitLabel$ | async }}
					@if (hasSubmitCounter$ | async) {
						<lu-numeric-badge disableTooltip palette="product" [value]="(submitCounter$ | async) ?? 0" />
					}
				</button>
			}
			<button type="button" luButton="ghost" (click)="dismiss()">{{ cancelLabel$ | async }}</button>
		</div>
	</div>
</div>
