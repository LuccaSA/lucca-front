<lu-scroll-box class="filterBar-scrollBox">
	<div class="filterBar-scrollBox-group">
		@if (addonBefore()) {
			<ng-container *ngTemplateOutlet="addonBefore()" />

			<lu-divider class="filterBar-divider" />
		}
		@if (optionalPills().length > 0) {
			<lu-filter-pill [label]="intl().additionalFilters" icon="filtersDescending" iconOnly backdrop>
				<lu-multi-select
					#optionalPillsSelect
					[options]="optionalPillOptions()"
					[optionComparer]="optionalPillComparer"
					[ngModel]="displayedOptionalPills()"
					[ngModelOptions]="{ standalone: true }"
					(ngModelChange)="displayOptionalPills($event)"
				>
					<ng-container *luOption="let pill; select: optionalPillsSelect">{{ pill.label() }}</ng-container>
					<ng-template #optionalPillsGroup let-group>{{ group.key }}</ng-template>
				</lu-multi-select>
			</lu-filter-pill>
		}

		<ng-content />
	</div>

	@if (addonAfter()) {
		<div class="filterBar-scrollBox-export">
			<ng-container *ngTemplateOutlet="addonAfter()" />
		</div>
	}
</lu-scroll-box>
