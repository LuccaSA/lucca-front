<button
	type="button"
	luButton="outlined"
	size="S"
	disclosure
	luPopoverNoCloseButton
	[luPopover2]="viewsPopover"
	[customPositions]="popoverPositions"
>
	@if (selectedLabel(); as label) {
		<span class="pr-u-mask">{{ intl().selectView }} - </span>
		{{ label }}
	} @else {
		{{ intl().selectView }}
	}
	<lu-icon icon="arrowChevronBottom" />
</button>

<ng-template #viewsPopover>
	<div class="filterPill_popover-content popover-contentOptional">
		@for (view of views(); track optionKey()(view); let index = $index) {
			<div class="filterPill_popover-content-option">
				<label luFormLabel [attr.for]="inputId(index)">{{ viewLabel()(view) }}</label>
				<span class="filterPill_popover-content-option-input">
					<input type="radio" [attr.id]="inputId(index)" [attr.name]="groupName" [checked]="isSelected(view)" (change)="selectView(view)" />
				</span>

				<button
					type="button"
					class="filterPill_popover-content-option-actions"
					size="XS"
					luButton="ghost"
					luPopoverNoCloseButton
					[attr.aria-label]="viewOptionsLabel(view)"
					[luPopover2]="optionsPopover"
					[customPositions]="popoverPositions"
				>
					<lu-icon icon="menuDots" [alt]="viewOptionsLabel(view)" />
				</button>

				<ng-template #optionsPopover>
					<div class="filterPill_popover-content popover-contentOptional">
						<button type="button" luButton="text" size="S" (click)="renameView.emit(view)">
							<lu-icon icon="edit" />
							{{ intl().renameView }}
						</button>
						<button type="button" luButton="text" size="S" critical (click)="deleteView.emit(view)">
							<lu-icon icon="trash" />
							{{ intl().deleteView }}
						</button>
					</div>
				</ng-template>
			</div>
		}
	</div>
</ng-template>
