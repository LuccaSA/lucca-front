<lu-select-option
	luCoreSelectPanelElement
	#rootOption="luCoreSelectPanelElement"
	[option]="branch().node"
	[optionTpl]="optionTpl()"
	[optionIndex]="optionIndex()"
	[scrollIntoViewOptions]="{ block: 'nearest' }"
	[isSelected]="coveredByRule() || (branch().node | luIsOptionSelected: optionComparer() : selectedOptions())"
	[collapsible]="collapsible() && (branch().expandable ?? (branch().children?.length ?? 0) > 0)"
	[expanded]="isExpanded()"
	(expandedChange)="reportExpanded($event)"
	[disclosureLabel]="disclosureLabel()"
	[isHidden]="hiddenByCollapse()"
	(selected)="toggle(branch())"
	(click)="toggle(branch(), $event)"
	(onlyParent)="toggleOne.emit(branch().node)"
	(onlyChildren)="selectOnlyChildren(branch())"
	[hasChildren]="!simpleMode() && !parentStandsForChildren() && (branch().children?.length ?? 0) > 0"
>
	@if (branch().children?.length) {
		<ng-container treeitem>
			@for (child of branch().children; track $index) {
				<lu-tree-branch
					[branch]="child"
					[optionTpl]="optionTpl()"
					[optionIndex]="optionIndex() + '-' + $index"
					[optionComparer]="optionComparer()"
					[selectedOptions]="selectedOptions()"
					[simpleMode]="simpleMode()"
					[collapsible]="collapsible()"
					[hiddenByCollapse]="childrenHiddenByCollapse()"
					[parentStandsForChildren]="parentStandsForChildren()"
					[coveredByRule]="childrenCoveredByRule()"
					(toggleOne)="toggleOne.emit($event)"
					(selectMany)="selectMany.emit($event)"
					(unselectMany)="unselectMany.emit($event)"
					(coveredUnselect)="onCoveredUnselect($event)"
					(parentSelectionBroken)="parentSelectionBroken.emit($event)"
				/>
			}
		</ng-container>
	}
</lu-select-option>
