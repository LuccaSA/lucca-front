name: Deploy Lucca Front

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy (e.g. v21.1.3 or master)'
        required: true
        default: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Lucca Front
    environment: production
    permissions:
      contents: read
    outputs:
      primary-path: ${{ steps.vars.outputs.primary-path }}
      alias-path: ${{ steps.vars.outputs.alias-path }}

    env:
      R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-tags: true        # ensure refs/tags/* are available for tag detection below

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24.15.0

      - name: Compute deploy paths
        id: vars
        env:
          # Pass untrusted input via env, NOT directly into the run block (prevents code injection).
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          # Source the ref from the manual input, else the triggering ref.
          RAW="$INPUT_REF"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF#refs/*/}"   # refs/tags/v21.1.3 -> v21.1.3 ; refs/heads/master -> master
          else
            RAW="${RAW#refs/*/}"          # normalize a manually-entered refs/tags|heads/... value
          fi

          PRIMARY="${RAW}/storybook"      # every deploy gets its own folder
          ALIAS=""

          # Only set the vX.Y alias when deploying an existing *stable* tag (vX.Y.Z with no suffix).
          if git show-ref --tags --verify --quiet "refs/tags/$RAW"; then
            if [[ "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              MM="$(echo "$RAW" | grep -oE '^v[0-9]+\.[0-9]+')"   # v21.1
              ALIAS="${MM}/storybook"                             # v21.1/storybook
            fi
          fi

          echo "primary-path=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "alias-path=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "Ref: ${RAW}    Primary: ${PRIMARY}    Alias: ${ALIAS:-<none>}"

      - run: npm ci
      - run: npm run build-storybook

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          # Secrets/vars via env, not interpolated into the script.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload results to R2
        env:
          # Step outputs are derived from untrusted input -> pass via env, don't interpolate.
          PRIMARY: ${{ steps.vars.outputs.primary-path }}
          ALIAS: ${{ steps.vars.outputs.alias-path }}
        run: |
          set -euo pipefail

          echo "Uploading build -> ${PRIMARY}"
          rclone sync ./storybook-static/ "r2:${R2_BUCKET}/${PRIMARY}" \
            --fast-list --checksum --transfers 8 --checkers 8

          if [ -n "$ALIAS" ]; then
            echo "Updating alias ${ALIAS} -> ${PRIMARY} (server-side copy)"
            rclone sync "r2:${R2_BUCKET}/${PRIMARY}" "r2:${R2_BUCKET}/${ALIAS}" \
              --fast-list --checksum --transfers 8 --checkers 8
          fi

  deploy-web-components:
    # Only a pushed *stable* tag publishes the bundle: never master, a prerelease or a manual run.
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    name: Deploy web components bundle
    environment: production
    permissions:
      contents: read
    # One publisher at a time, whatever the tag: the version check and the uploads below must not interleave with
    # another release's. An active upload is never cancelled.
    concurrency:
      group: deploy-web-components
      cancel-in-progress: false

    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24.15.0

      - run: npm ci

      - name: Build web components bundle
        run: |
          export VERSION="${VERSION#v}"
          npm run build:web-components

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          # Secrets/vars via env, not interpolated into the script.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload web components bundle to R2
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"

          # Only the latest bundle is kept: a backport tagged after a newer release must not replace it.
          # A missing version.txt (first publication) is confirmed by a listing; any other read failure aborts, so that a
          # failed read is never mistaken for a first publication.
          set +e
          LISTING="$(rclone lsf "r2:${R2_BUCKET}/web-components/" --files-only --include version.txt)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 3 ] || { [ "$STATUS" -eq 0 ] && [ -z "$LISTING" ]; }; then
            # rclone exit code 3: directory not found
            CURRENT=""
          elif [ "$STATUS" -eq 0 ]; then
            CURRENT="$(rclone cat "r2:${R2_BUCKET}/web-components/version.txt")"
            if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unexpected published version: '${CURRENT}'" >&2
              exit 1
            fi
          else
            echo "Cannot read the published version (rclone exit code ${STATUS})" >&2
            exit 1
          fi

          if [ -n "$CURRENT" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "Skipping web components ${VERSION}: ${CURRENT} is already published"
            exit 0
          fi

          echo "Uploading web components ${VERSION} (replacing ${CURRENT:-<none>})"
          for file in bundle.js bundle.css; do
            rclone copyto "dist/web-components/${file}" "r2:${R2_BUCKET}/web-components/${file}" --checksum
          done
          # Written last: it records a complete upload
          rclone copyto dist/web-components/version.txt "r2:${R2_BUCKET}/web-components/version.txt" --checksum
