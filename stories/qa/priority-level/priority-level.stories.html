<table class="demo-QAtable">
	<tbody>
		<tr>
			<td></td>
			<td style="inline-size: 50%">
				<div class="demo-QAtable-list">HTML</div>
			</td>
			<td style="inline-size: 50%">
				<div class="demo-QAtable-list">Angular</div>
			</td>
		</tr>
		<tr>
			<td>Level</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="priorityLevel mod-low">
						<span class="priorityLevel-icon"><span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-XS"></span></span>
						<span class="priorityLevel-label">Low</span>
					</div>
					<div class="priorityLevel mod-medium">
						<span class="priorityLevel-icon"><span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-XS"></span></span>
						<span class="priorityLevel-label">Medium</span>
					</div>
					<div class="priorityLevel mod-high">
						<span class="priorityLevel-icon"><span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-XS"></span></span>
						<span class="priorityLevel-label">High</span>
					</div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-priority-level [level]="1" />
					<lu-priority-level [level]="2" />
					<lu-priority-level [level]="3" />
				</div>
			</td>
		</tr>
		<tr>
			<td>Size</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="priorityLevel mod-low mod-S">
						<span class="priorityLevel-icon"><span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-XXS"></span></span>
						<span class="priorityLevel-label">Low</span>
					</div>
					<div class="priorityLevel mod-low">
						<span class="priorityLevel-icon"><span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-XS"></span></span>
						<span class="priorityLevel-label">Low</span>
					</div>
					<div class="priorityLevel mod-low mod-L">
						<span class="priorityLevel-icon"><span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-S"></span></span>
						<span class="priorityLevel-label">Low</span>
					</div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-priority-level [level]="1" size="S" />
					<lu-priority-level [level]="1" size="M" />
					<lu-priority-level [level]="1" size="L" />
				</div>
			</td>
		</tr>
		<tr>
			<td>Hidden label</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="priorityLevel mod-high">
						<span class="priorityLevel-icon" [luTooltip]="'High'" luTooltipOnlyForDisplay>
							<span aria-hidden="true" class="lucca-icon icon-priorityLevels mod-XS"></span>
						</span>
						<span class="priorityLevel-label pr-u-mask">High</span>
					</div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-priority-level [level]="3" [hiddenLabel]="true" />
				</div>
			</td>
		</tr>
	</tbody>
</table>

<!-- To tell the ui-diff tool that the page has finished rendering -->
<span id="ready"></span>
