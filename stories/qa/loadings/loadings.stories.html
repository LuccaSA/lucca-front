<table class="demo-QAtable">
	<tbody>
		<tr>
			<td></td>
			<td>
				<div class="demo-QAtable-list">HTML</div>
			</td>
			<td>
				<div class="demo-QAtable-list">Angular</div>
			</td>
		</tr>
		<tr>
			<td>Default</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading mod-hiddenLabel"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading /></div>
			</td>
		</tr>
		<tr>
			<td>Default label displayed</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading [hiddenLabel]="false" /></div>
			</td>
		</tr>
		<tr>
			<td>Default label overridden</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading"><span class="loading-label">Fetching data…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading [hiddenLabel]="false" [intl]="{ label: 'Fetching data…' }" /></div>
			</td>
		</tr>
		<tr>
			<td>Label</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading>Loading…</lu-loading></div>
			</td>
		</tr>
		<tr>
			<td>Hidden label</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading mod-hiddenLabel"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading hiddenLabel>Loading…</lu-loading></div>
			</td>
		</tr>
		<tr>
			<td>Block</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading mod-block"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading block>Loading…</lu-loading></div>
			</td>
		</tr>
		<tr>
			<td>Large</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading mod-L"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list"><lu-loading size="L">Loading…</lu-loading></div>
			</td>
		</tr>
		<tr>
			<td>Inverted</td>
			<td>
				<div class="demo-QAtable-list mod-black">
					<div class="loading mod-invert"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list mod-black"><lu-loading invert>Loading…</lu-loading></div>
			</td>
		</tr>
		<tr>
			<td>Template Popin</td>
			<td>
				<div class="demo-QAtable-list">
					<div class="loading mod-popin mod-hiddenLabel"><span class="loading-label">Loading…</span></div>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-loading template="popin" />
				</div>
			</td>
		</tr>
	</tbody>
</table>

<!-- To tell the ui-diff tool that the page has finished rendering -->
<span id="ready"></span>
