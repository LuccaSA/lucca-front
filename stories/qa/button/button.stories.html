<table class="demo-QAtable">
	<tbody>
		<tr>
			<td></td>
			<td><div class="demo-QAtable-list">HTML</div></td>
			<td><div class="demo-QAtable-list">Angular</div></td>
		</tr>
		@for (type of types(); track type.label) {
			@for (size of sizes; track size.label) {
				<tr>
					<td>{{ type.label }} {{ size.label }}</td>
					<td>
						<div class="demo-QAtable-list" [class.mod-black]="type.invert">
							@if (element() === "a") {
								<a href="#" [class]="htmlClasses(type, size, 'text')" [attr.aria-disabled]="ariaDisabled()">Button</a>
								<a href="#" [class]="htmlClasses(type, size, 'iconLeft')" [attr.aria-disabled]="ariaDisabled()"
									><span aria-hidden="true" class="lucca-icon icon-heart"></span>Button</a
								>
								<a href="#" [class]="htmlClasses(type, size, 'iconRight')" [attr.aria-disabled]="ariaDisabled()"
									>Button<span aria-hidden="true" class="lucca-icon icon-heart"></span
								></a>
								<a href="#" [class]="htmlClasses(type, size, 'iconOnly')" [attr.aria-disabled]="ariaDisabled()"
									><span aria-hidden="true" class="lucca-icon icon-heart"></span><span class="pr-u-mask">Alt text</span></a
								>
								<a href="#" [class]="htmlClasses(type, size, 'counter')" [attr.aria-disabled]="ariaDisabled()"
									>Button<span class="numericBadge">7</span></a
								>
								<a href="#" [class]="htmlClasses(type, size, 'disclosure')" [attr.aria-disabled]="ariaDisabled()"
									>Button<span aria-hidden="true" class="lucca-icon icon-arrowChevronBottom"></span
								></a>
							} @else {
								<button
									type="button"
									[class]="htmlClasses(type, size, 'text')"
									[attr.aria-disabled]="ariaDisabled()"
									[disabled]="disabled()"
								>
									Button
								</button>
								<button
									type="button"
									[class]="htmlClasses(type, size, 'iconLeft')"
									[attr.aria-disabled]="ariaDisabled()"
									[disabled]="disabled()"
								>
									<span aria-hidden="true" class="lucca-icon icon-heart"></span>Button
								</button>
								<button
									type="button"
									[class]="htmlClasses(type, size, 'iconRight')"
									[attr.aria-disabled]="ariaDisabled()"
									[disabled]="disabled()"
								>
									Button<span aria-hidden="true" class="lucca-icon icon-heart"></span>
								</button>
								<button
									type="button"
									[class]="htmlClasses(type, size, 'iconOnly')"
									[attr.aria-disabled]="ariaDisabled()"
									[disabled]="disabled()"
								>
									<span aria-hidden="true" class="lucca-icon icon-heart"></span><span class="pr-u-mask">Alt text</span>
								</button>
								<button
									type="button"
									[class]="htmlClasses(type, size, 'counter')"
									[attr.aria-disabled]="ariaDisabled()"
									[disabled]="disabled()"
								>
									Button<span class="numericBadge">7</span>
								</button>
								<button
									type="button"
									[class]="htmlClasses(type, size, 'disclosure')"
									[attr.aria-disabled]="ariaDisabled()"
									[disabled]="disabled()"
								>
									Button<span aria-hidden="true" class="lucca-icon icon-arrowChevronBottom"></span>
								</button>
							}
						</div>
					</td>
					<td>
						<div class="demo-QAtable-list" [class.mod-black]="type.invert">
							@if (element() === "a") {
								<a
									href="#"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									>Button</a
								>
								<a
									href="#"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									><lu-icon icon="heart" />Button</a
								>
								<a
									href="#"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									>Button<lu-icon icon="heart"
								/></a>
								<a
									href="#"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									><lu-icon icon="heart" alt="Alt text"
								/></a>
								<a
									href="#"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									>Button<lu-numeric-badge [value]="7"
								/></a>
								<a
									href="#"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									disclosure
									>Button<lu-icon icon="arrowChevronBottom"
								/></a>
							} @else {
								<button
									type="button"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									[state]="ngState()"
									[disabled]="state() === 'disabled'"
								>
									Button
								</button>
								<button
									type="button"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									[state]="ngState()"
									[disabled]="state() === 'disabled'"
								>
									<lu-icon icon="heart" />Button
								</button>
								<button
									type="button"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									[state]="ngState()"
									[disabled]="state() === 'disabled'"
								>
									Button<lu-icon icon="heart" />
								</button>
								<button
									type="button"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									[state]="ngState()"
									[disabled]="state() === 'disabled'"
								>
									<lu-icon icon="heart" alt="Alt text" />
								</button>
								<button
									type="button"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									[state]="ngState()"
									[disabled]="state() === 'disabled'"
								>
									Button<lu-numeric-badge [value]="7" />
								</button>
								<button
									type="button"
									[luButton]="type.luButton"
									[size]="size.size"
									[palette]="$any(palette())"
									[critical]="!!type.critical"
									[attr.aria-disabled]="ariaDisabled()"
									disclosure
									[state]="ngState()"
									[disabled]="state() === 'disabled'"
								>
									Button<lu-icon icon="arrowChevronBottom" />
								</button>
							}
						</div>
					</td>
				</tr>
			}
		}
	</tbody>
</table>

<!-- To tell the ui-diff tool that the page has finished rendering -->
<span id="ready"></span>
