<table class="demo-QAtable">
	<tbody>
		<tr>
			<td></td>
			<td>
				<div class="demo-QAtable-list">Angular</div>
			</td>
			<td>
				<div class="demo-QAtable-list">Angular selected</div>
			</td>
			<td>
				<div class="demo-QAtable-list">Angular selected clearable</div>
			</td>
		</tr>
		<tr>
			<td>Checkbox</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Arroser">
						<lu-checkbox-input [checked]="false" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<lu-filter-pill label="Arroser">
					<lu-checkbox-input [checked]="true" />
				</lu-filter-pill>
			</td>
			<td></td>
		</tr>
		<tr>
			<td>Select simple</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="null" clearable="false" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="'Artichaut'" clearable="false" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="'Artichaut'" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Select multi</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="[]" clearable="false" filterPillLabelPlural="légumes" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="['Artichaut']" clearable="false" filterPillLabelPlural="légumes" [options]="legumes" />
					</lu-filter-pill>
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="['Artichaut', 'Asperge']" clearable="false" filterPillLabelPlural="légumes" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="['Artichaut']" filterPillLabelPlural="légumes" [options]="legumes" />
					</lu-filter-pill>
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="['Artichaut', 'Asperge']" filterPillLabelPlural="légumes" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Select multi with select all</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes" name="legume">
						<lu-multi-select
							withSelectAll
							withSelectAllDisplayerLabel="légumes"
							[value]="{ mode: 'none' }"
							clearable="false"
							[options]="legumes | filterLegumes: clue"
							[totalCount]="legumes.length"
							(clueChange)="clue = $event"
							filterPillLabelPlural="légumes"
						/>
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes" name="legume">
						<lu-multi-select
							withSelectAll
							withSelectAllDisplayerLabel="légumes"
							[value]="{ mode: 'all' }"
							clearable="false"
							[options]="legumes | filterLegumes: clue"
							[totalCount]="legumes.length"
							(clueChange)="clue = $event"
							filterPillLabelPlural="légumes"
						/>
					</lu-filter-pill>
					<lu-filter-pill label="Légumes" name="legume">
						<lu-multi-select
							withSelectAll
							withSelectAllDisplayerLabel="légumes"
							[value]="{ mode: 'exclude', values: ['Artichaut'] }"
							clearable="false"
							[options]="legumes | filterLegumes: clue"
							[totalCount]="legumes.length"
							(clueChange)="clue = $event"
							filterPillLabelPlural="légumes"
						/>
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes" name="legume">
						<lu-multi-select
							withSelectAll
							withSelectAllDisplayerLabel="légumes"
							[value]="{ mode: 'all' }"
							[options]="legumes | filterLegumes: clue"
							[totalCount]="legumes.length"
							(clueChange)="clue = $event"
							filterPillLabelPlural="légumes"
						/>
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Tree select simple</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="null" clearable="false" [treeSelect]="groupingFn" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="'Artichaut'" clearable="false" [treeSelect]="groupingFn" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="'Artichaut'" [treeSelect]="groupingFn" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Tree select multi</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="[]" clearable="false" filterPillLabelPlural="légumes" [treeSelect]="groupingFn" [options]="legumes" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes">
						<lu-multi-select
							[value]="['Artichaut']"
							clearable="false"
							filterPillLabelPlural="légumes"
							[treeSelect]="groupingFn"
							[options]="legumes"
						/>
					</lu-filter-pill>
					<lu-filter-pill label="Légumes">
						<lu-multi-select
							[value]="['Artichaut', 'Asperge']"
							clearable="false"
							filterPillLabelPlural="légumes"
							[treeSelect]="groupingFn"
							[options]="legumes"
						/>
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Légumes">
						<lu-multi-select [value]="['Artichaut']" filterPillLabelPlural="légumes" [treeSelect]="groupingFn" [options]="legumes" />
					</lu-filter-pill>
					<lu-filter-pill label="Légumes">
						<lu-multi-select
							[value]="['Artichaut', 'Asperge']"
							filterPillLabelPlural="légumes"
							[treeSelect]="groupingFn"
							[options]="legumes"
						/>
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Departement simple</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Département" name="department">
						<lu-simple-select [value]="null" clearable="false" departments />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Département" name="department">
						<lu-simple-select [value]="selectedDepartment" clearable="false" departments />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Département" name="department">
						<lu-simple-select [value]="selectedDepartment" departments />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Departement multi</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Départements" name="departments">
						<lu-multi-select [value]="[]" clearable="false" filterPillLabelPlural="départements" departments />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Départements" name="departments">
						<lu-multi-select [value]="[selectedDepartment]" clearable="false" filterPillLabelPlural="départements" departments />
					</lu-filter-pill>
					<lu-filter-pill label="Départements" name="departments">
						<lu-multi-select [value]="selectedDepartments" clearable="false" filterPillLabelPlural="départements" departments />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Départements" name="departments">
						<lu-multi-select [value]="[selectedDepartment]" filterPillLabelPlural="départements" departments />
					</lu-filter-pill>
					<lu-filter-pill label="Départements" name="departments">
						<lu-multi-select [value]="selectedDepartments" filterPillLabelPlural="départements" departments />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Date</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Date de début">
						<lu-date-input [value]="null" clearable="false" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Date de début">
						<lu-date-input [value]="selectedDate" clearable="false" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Date de début">
						<lu-date-input [value]="selectedDate" />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>Period</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Période">
						<lu-date-range-input [value]="null" clearable="false" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Période">
						<lu-date-range-input [value]="selectedDateRange" clearable="false" />
					</lu-filter-pill>
				</div>
			</td>
			<td>
				<div class="demo-QAtable-list">
					<lu-filter-pill label="Période">
						<lu-date-range-input [value]="selectedDateRange" />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
		<tr>
			<td>FilterViewSelector</td>
			<td colspan="3">
				<div class="demo-QAtable-list">
					<lu-filter-view-selector [views]="views" [(selectedView)]="selectedView" />
					<lu-filter-pill label="Arroser">
						<lu-checkbox-input [checked]="false" />
					</lu-filter-pill>
					<lu-filter-pill label="Légume">
						<lu-simple-select [value]="null" clearable="false" [options]="legumes" />
					</lu-filter-pill>
					<lu-filter-pill label="Département" name="department">
						<lu-simple-select [value]="null" clearable="false" departments />
					</lu-filter-pill>
					<lu-filter-pill label="Date de début">
						<lu-date-input [value]="null" clearable="false" />
					</lu-filter-pill>
				</div>
			</td>
		</tr>
	</tbody>
</table>

<!-- To tell the ui-diff tool that the page has finished rendering -->
<span id="ready"></span>
