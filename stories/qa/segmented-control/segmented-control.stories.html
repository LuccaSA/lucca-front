<table class="demo-QAtable">
	<tbody>
		<tr>
			<td></td>
			<td>
				<div class="demo-QAtable-list">HTML</div>
			</td>
			<td>
				<div class="demo-QAtable-list">Angular</div>
			</td>
		</tr>
		<tr>
			<td>Filters</td>
			<td>
				<ul class="segmentedControl" role="radiogroup" aria-label="Lorem ipsum">
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabA" id="tab1" checked />
						<label for="tab1" class="segmentedControl-item-action">Lorem</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabA" id="tab2" />
						<label for="tab2" class="segmentedControl-item-action"> Ipsum </label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabA" id="tab3" />
						<label for="tab3" class="segmentedControl-item-action"> Dolor sit </label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabA" id="tab4" disabled />
						<label for="tab4" class="segmentedControl-item-action">Lorem Consectetur</label>
					</li>
				</ul>
			</td>
			<td>
				<lu-segmented-control [ariaLabel]="'Lorem ipsum'" [(ngModel)]="filtersValue">
					<lu-segmented-control-filter label="Lorem" value="0" />
					<lu-segmented-control-filter label="Ipsum" value="1" />
					<lu-segmented-control-filter label="Dolor sit" value="2" />
					<lu-segmented-control-filter label="Lorem Consectetur" value="3" disabled />
				</lu-segmented-control>
			</td>
		</tr>
		<tr>
			<td>Filters + Numeric</td>
			<td>
				<ul class="segmentedControl" role="radiogroup" aria-label="Lorem ipsum">
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabB" id="tab1" checked />
						<label for="tab1" class="segmentedControl-item-action">Lorem <span class="numericBadge">1</span></label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabB" id="tab2" />
						<label for="tab2" class="segmentedControl-item-action">
							Ipsum
							<span class="numericBadge">2</span>
						</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabB" id="tab3" />
						<label for="tab3" class="segmentedControl-item-action">
							Dolor sit
							<span class="numericBadge">34</span>
						</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabB" id="tab4" disabled />
						<label for="tab4" class="segmentedControl-item-action">Lorem Consectetur <span class="numericBadge">567</span></label>
					</li>
				</ul>
			</td>
			<td>
				<ng-template #filtersNumericLabel1>Lorem <lu-numeric-badge value="1" /></ng-template>
				<ng-template #filtersNumericLabel2>Ipsum <lu-numeric-badge value="2" /></ng-template>
				<ng-template #filtersNumericLabel3>Dolor sit <lu-numeric-badge value="34" /></ng-template>
				<ng-template #filtersNumericLabel4>Lorem Consectetur <lu-numeric-badge value="567" /></ng-template>
				<lu-segmented-control [ariaLabel]="'Lorem ipsum'" [(ngModel)]="filtersNumericValue">
					<lu-segmented-control-filter [label]="filtersNumericLabel1" value="0" />
					<lu-segmented-control-filter [label]="filtersNumericLabel2" value="1" />
					<lu-segmented-control-filter [label]="filtersNumericLabel3" value="2" />
					<lu-segmented-control-filter [label]="filtersNumericLabel4" value="3" disabled />
				</lu-segmented-control>
			</td>
		</tr>
		<tr>
			<td>Filters + Numeric + Loading</td>
			<td>
				<ul class="segmentedControl" role="radiogroup" aria-label="Lorem ipsum">
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabC" id="tab1" checked />
						<label for="tab1" class="segmentedControl-item-action">Lorem <span class="numericBadge is-loading">1</span></label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabC" id="tab2" />
						<label for="tab2" class="segmentedControl-item-action">
							Ipsum
							<span class="numericBadge is-loading">2</span>
						</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabC" id="tab3" />
						<label for="tab3" class="segmentedControl-item-action">
							Dolor sit
							<span class="numericBadge is-loading">34</span>
						</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabC" id="tab4" disabled />
						<label for="tab4" class="segmentedControl-item-action"
							>Lorem Consectetur <span class="numericBadge is-loading">567</span></label
						>
					</li>
				</ul>
			</td>
			<td>
				<ng-template #filtersLoadingLabel1>Lorem <lu-numeric-badge value="1" loading /></ng-template>
				<ng-template #filtersLoadingLabel2>Ipsum <lu-numeric-badge value="2" loading /></ng-template>
				<ng-template #filtersLoadingLabel3>Dolor sit <lu-numeric-badge value="34" loading /></ng-template>
				<ng-template #filtersLoadingLabel4>Lorem Consectetur <lu-numeric-badge value="567" loading /></ng-template>
				<lu-segmented-control [ariaLabel]="'Lorem ipsum'" [(ngModel)]="filtersLoadingValue">
					<lu-segmented-control-filter [label]="filtersLoadingLabel1" value="0" />
					<lu-segmented-control-filter [label]="filtersLoadingLabel2" value="1" />
					<lu-segmented-control-filter [label]="filtersLoadingLabel3" value="2" />
					<lu-segmented-control-filter [label]="filtersLoadingLabel4" value="3" disabled />
				</lu-segmented-control>
			</td>
		</tr>
		<tr>
			<td>Filters + S</td>
			<td>
				<ul class="segmentedControl mod-S" role="radiogroup" aria-label="Lorem ipsum">
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabD" id="tab1" checked />
						<label for="tab1" class="segmentedControl-item-action">Lorem <span class="numericBadge">1</span></label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabD" id="tab2" />
						<label for="tab2" class="segmentedControl-item-action">
							Ipsum
							<span class="numericBadge">2</span>
						</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabD" id="tab3" />
						<label for="tab3" class="segmentedControl-item-action">
							Dolor sit
							<span class="numericBadge is-loading">34</span>
						</label>
					</li>
					<li class="segmentedControl-item">
						<input type="radio" class="segmentedControl-item-input" name="tabD" id="tab4" disabled />
						<label for="tab4" class="segmentedControl-item-action">Lorem Consectetur <span class="numericBadge">567</span></label>
					</li>
				</ul>
			</td>
			<td>
				<ng-template #filtersSmallLabel1>Lorem <lu-numeric-badge value="1" /></ng-template>
				<ng-template #filtersSmallLabel2>Ipsum <lu-numeric-badge value="2" /></ng-template>
				<ng-template #filtersSmallLabel3>Dolor sit <lu-numeric-badge value="34" loading /></ng-template>
				<ng-template #filtersSmallLabel4>Lorem Consectetur <lu-numeric-badge value="567" /></ng-template>
				<lu-segmented-control small [ariaLabel]="'Lorem ipsum'" [(ngModel)]="filtersSmallValue">
					<lu-segmented-control-filter [label]="filtersSmallLabel1" value="0" />
					<lu-segmented-control-filter [label]="filtersSmallLabel2" value="1" />
					<lu-segmented-control-filter [label]="filtersSmallLabel3" value="2" />
					<lu-segmented-control-filter [label]="filtersSmallLabel4" value="3" disabled />
				</lu-segmented-control>
			</td>
		</tr>
	</tbody>
</table>

<!-- To tell the ui-diff tool that the page has finished rendering -->
<span id="ready"></span>
